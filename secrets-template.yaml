# Infisical Secrets Template for KIND
# ====================================
# Copy this file and fill in values before applying
#
# Generate encryption keys:
#   openssl rand -hex 16  # For ENCRYPTION_KEY
#   openssl rand -hex 32  # For AUTH_SECRET
#
# Usage:
#   kubectl create namespace infisical
#   kubectl apply -f secrets.yaml -n infisical
#   helm install infisical ./forks/infisical/helm-charts/infisical-standalone-postgres \
#     -f ./forks/infisical/values_kind.yaml -n infisical

apiVersion: v1
kind: Secret
metadata:
  name: infisical-secrets
  namespace: infisical
type: Opaque
stringData:
  # Required: 32-character hex string for encryption
  # Generate with: openssl rand -hex 16
  ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef"

  # Required: Secret for JWT signing
  # Generate with: openssl rand -hex 32
  AUTH_SECRET: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"

  # Database connection (matches values_kind.yaml postgresql settings)
  DB_CONNECTION_URI: "postgresql://infisical:infisical-dev-password@infisical-postgresql:5432/infisicalDB"

  # Redis connection (matches values_kind.yaml redis settings)
  REDIS_URL: "redis://:redis-dev-password@infisical-redis-master:6379"

  # Site URL - must match ingress hostname
  SITE_URL: "http://infisical.localhost"

  # Optional: SMTP configuration for emails (leave empty for dev)
  # SMTP_HOST: ""
  # SMTP_PORT: ""
  # SMTP_USERNAME: ""
  # SMTP_PASSWORD: ""
  # SMTP_FROM_ADDRESS: ""
  # SMTP_FROM_NAME: ""

  # Optional: Telemetry (disable for local dev)
  TELEMETRY_ENABLED: "false"
